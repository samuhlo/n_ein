name: Vigía de runtimes
# =============================================================================
# [FLOW] RUNTIMES AL DÍA
# Cada día busca versiones nuevas de Pi, el puente de Claude, Claude Code y
# CodeGraph, las aplica sobre el último tag publicado de la preview y pasa la
# matriz completa. Si pasa, publica una preview de mantenimiento que el launcher
# ofrece con `u`, y abre la PR del mismo commit a main. Si falla, prueba cada
# grupo por separado, bloquea en un issue lo que rompe y vuelve a lanzarse para
# publicar el resto. La estable nunca se publica sola.
# =============================================================================
on:
  schedule:
    - cron: '37 5 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: Publicar si la matriz pasa
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: runtimes
  cancel-in-progress: false
env:
  CHANNEL: preview
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
    outputs:
      changed: ${{ steps.prepare.outputs.changed }}
      base: ${{ steps.prepare.outputs.base }}
      version: ${{ steps.prepare.outputs.version }}
      branch: ${{ steps.prepare.outputs.branch }}
      groups: ${{ steps.prepare.outputs.groups }}
      multi: ${{ steps.prepare.outputs.multi }}
      subject: ${{ steps.prepare.outputs.subject }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Memoria del vigía en issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/runtimes
          gh label create runtimes --color FFCA40 --description 'Vigía de runtimes' --force
          gh issue list --label runtimes --state all --limit 300 --json state,stateReason,body > dist/runtimes/issues.json
          bun scripts/runtimes/cli.ts state < dist/runtimes/issues.json > dist/runtimes/state.json
      - name: Plan y rama sobre el último tag publicado
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="$(gh release list --exclude-drafts --limit 100 --json tagName,isPrerelease,isDraft | bun scripts/runtimes/cli.ts base --channel "$CHANNEL")"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          tree="$RUNNER_TEMP/base"
          git worktree add -q --detach "$tree" "$base"
          bun scripts/runtimes/cli.ts plan --source "$tree" --state dist/runtimes/state.json > dist/runtimes/plan.json
          # Un puente con red nueva queda retenido: se abre su revisión y el resto sigue.
          bun scripts/runtimes/cli.ts issues --plan dist/runtimes/plan.json --kind review --run "$RUN_URL" > dist/runtimes/review.json
          jq -c '.[]' dist/runtimes/review.json | while read -r draft; do
            gh issue create --label runtimes --title "$(jq -r .title <<<"$draft")" --body "$(jq -r .body <<<"$draft")"
          done
          groups="$(bun scripts/runtimes/cli.ts groups --plan dist/runtimes/plan.json)"
          if [[ -z "$groups" ]]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="$(bun scripts/runtimes/cli.ts next-version --source "$tree")"
          branch="hotfix/runtimes-$version"
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$tree" switch -qc "$branch"
          subject="$(bun scripts/runtimes/cli.ts apply --source "$tree" --plan dist/runtimes/plan.json --version "$version")"
          git -C "$tree" add -A
          git -C "$tree" commit -qm "$subject"
          git -C "$tree" push -q origin "$branch"
          multi=false
          [[ "$groups" != *,* ]] || multi=true
          {
            echo 'changed=true'
            echo "version=$version"
            echo "branch=$branch"
            echo "groups=$groups"
            echo "multi=$multi"
            echo "subject=$subject"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: runtimes-plan
          path: dist/runtimes/
          retention-days: 14

  candidate:
    needs: plan
    if: needs.plan.outputs.changed == 'true'
    uses: ./.github/workflows/candidate.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      ref: ${{ needs.plan.outputs.branch }}

  # -----------------------------------------------------------------------------
  # Matriz verde: tag, publicación y PR a main
  # -----------------------------------------------------------------------------
  tag:
    needs: [plan, candidate]
    if: needs.candidate.result == 'success' && (github.event_name == 'schedule' || inputs.publish)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.branch }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Guarda y tag del commit comprobado
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          bun scripts/runtimes/cli.ts guard --source .
          git tag "v$VERSION"
          git push -q origin "v$VERSION"

  publish:
    needs: [plan, tag]
    permissions:
      contents: write
      id-token: write
      attestations: write
      pages: write
    uses: ./.github/workflows/publish.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      tag: v${{ needs.plan.outputs.version }}
      prerelease: true

  main:
    needs: [plan, publish]
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - name: PR a main con el mismo commit
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.plan.outputs.branch }}
          VERSION: ${{ needs.plan.outputs.version }}
          SUBJECT: ${{ needs.plan.outputs.subject }}
        run: |
          body="$(printf 'El vigía publicó [v%s](%s/%s/releases/tag/v%s) con este commit tras pasar la matriz completa ([ejecución](%s)).\n\nIntégrala en main antes de la próxima release: la guarda de release.yml rechaza publicar runtimes más antiguos que los ya publicados.' \
            "$VERSION" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$VERSION" "$RUN_URL")"
          url="$(gh pr create -R "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --title "$SUBJECT" --label runtimes --body "$body")"
          # Las PR anteriores del vigía quedan sustituidas: esta rama parte de su release y ya lleva sus commits.
          gh pr list -R "$GITHUB_REPOSITORY" --label runtimes --state open --json number,headRefName \
            --jq ".[] | select(.headRefName != \"$BRANCH\") | .number" | while read -r number; do
            gh pr close "$number" -R "$GITHUB_REPOSITORY" --comment "Sustituida por $url."
          done

  # -----------------------------------------------------------------------------
  # Matriz roja: cada grupo por separado, issue de bloqueo y otra vuelta con el resto
  # -----------------------------------------------------------------------------
  probes:
    needs: [plan, candidate]
    if: always() && needs.plan.outputs.multi == 'true' && needs.candidate.result == 'failure'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/download-artifact@v7
        with:
          name: runtimes-plan
          path: dist/runtimes
      - name: Una rama por grupo
        env:
          BASE: ${{ needs.plan.outputs.base }}
          VERSION: ${{ needs.plan.outputs.version }}
          GROUPS: ${{ needs.plan.outputs.groups }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for group in ${GROUPS//,/ }; do
            tree="$RUNNER_TEMP/$group"
            git worktree add -q --detach "$tree" "$BASE"
            git -C "$tree" switch -qc "runtimes-probe/$group-$VERSION"
            subject="$(bun scripts/runtimes/cli.ts apply --source "$tree" --plan dist/runtimes/plan.json --groups "$group" --version "$VERSION")"
            git -C "$tree" add -A
            git -C "$tree" commit -qm "$subject"
            git -C "$tree" push -q origin "runtimes-probe/$group-$VERSION"
          done

  probe-pi:
    needs: [plan, probes]
    if: always() && needs.probes.result == 'success' && contains(needs.plan.outputs.groups, 'pi')
    uses: ./.github/workflows/candidate.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      ref: runtimes-probe/pi-${{ needs.plan.outputs.version }}
      artifact: probe-pi
  probe-claude:
    needs: [plan, probes]
    if: always() && needs.probes.result == 'success' && contains(needs.plan.outputs.groups, 'claude')
    uses: ./.github/workflows/candidate.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      ref: runtimes-probe/claude-${{ needs.plan.outputs.version }}
      artifact: probe-claude
  probe-codegraph:
    needs: [plan, probes]
    if: always() && needs.probes.result == 'success' && contains(needs.plan.outputs.groups, 'codegraph')
    uses: ./.github/workflows/candidate.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      ref: runtimes-probe/codegraph-${{ needs.plan.outputs.version }}
      artifact: probe-codegraph

  report:
    needs: [plan, candidate, probes, probe-pi, probe-claude, probe-codegraph]
    if: always() && needs.plan.outputs.changed == 'true' && needs.candidate.result == 'failure'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/download-artifact@v7
        with:
          name: runtimes-plan
          path: dist/runtimes
      - name: Bloquear lo que rompe y relanzar con el resto
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          BRANCH: ${{ needs.plan.outputs.branch }}
          GROUPS: ${{ needs.plan.outputs.groups }}
          MULTI: ${{ needs.plan.outputs.multi }}
          PROBES: ${{ needs.probes.result }}
          PI: ${{ needs.probe-pi.result }}
          CLAUDE: ${{ needs.probe-claude.result }}
          CODEGRAPH: ${{ needs.probe-codegraph.result }}
        run: |
          all=(${GROUPS//,/ })
          failing=()
          if [[ "$MULTI" == true && "$PROBES" == success ]]; then
            [[ "$PI" != failure ]] || failing+=(pi)
            [[ "$CLAUDE" != failure ]] || failing+=(claude)
            [[ "$CODEGRAPH" != failure ]] || failing+=(codegraph)
          fi
          # Un solo grupo, pruebas que no llegaron a correr, o grupos que pasan solos pero no juntos: se bloquea todo.
          if ((${#failing[@]} == 0)); then failing=("${all[@]}"); fi
          blocked="$(IFS=,; echo "${failing[*]}")"
          bun scripts/runtimes/cli.ts issues --plan dist/runtimes/plan.json --kind blocked --groups "$blocked" --run "$RUN_URL" > dist/runtimes/blocked.json
          jq -c '.[]' dist/runtimes/blocked.json | while read -r draft; do
            gh issue create --label runtimes --title "$(jq -r .title <<<"$draft")" --body "$(jq -r .body <<<"$draft")"
          done
          # Las ramas fallidas no se publican: el issue enlaza el log de esta ejecución.
          for ref in "$BRANCH" $(for group in "${all[@]}"; do echo "runtimes-probe/$group-$VERSION"; done); do
            git push -q origin --delete "$ref" 2>/dev/null || true
          done
          if ((${#failing[@]} < ${#all[@]})); then
            gh workflow run runtimes.yml --ref "$GITHUB_REF_NAME"
          fi
