name: Publicar release comprobada
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      value: ${{ steps.version.outputs.value }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - id: version
        run: |
          (cd go && go build -o ../dist/n-ein-install ./cmd/n-ein-install)
          value="${GITHUB_REF_NAME#v}"
          test "$value" = "$(cat VERSION)"
          test "$value" = "${value%%+*}"
          channel="$(./dist/n-ein-install version "$value")"
          echo "value=$value" >> "$GITHUB_OUTPUT"
          if [[ "$channel" == stable ]]; then echo 'prerelease=false'; else echo 'prerelease=true'; fi >> "$GITHUB_OUTPUT"
      # Una release desde main sin la PR del vigía integrada bajaría los runtimes ya publicados.
      - name: Ningún runtime baja respecto al tag anterior
        run: bun scripts/runtimes/cli.ts guard --source .
  candidate:
    needs: version
    uses: ./.github/workflows/candidate.yml
    with:
      version: ${{ needs.version.outputs.value }}
  publish:
    needs: [version, candidate]
    permissions:
      contents: write
      id-token: write
      attestations: write
      pages: write
    uses: ./.github/workflows/publish.yml
    with:
      version: ${{ needs.version.outputs.value }}
      tag: ${{ github.ref_name }}
      prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
