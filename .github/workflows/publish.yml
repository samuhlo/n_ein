name: Publicar adjuntos comprobados
# Reutilizable: la llaman release.yml (tag empujado a mano) y runtimes.yml (vigía).
# Publica exactamente los adjuntos del candidato de la misma ejecución.
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      tag:
        required: true
        type: string
      prerelease:
        required: true
        type: boolean
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v7
        with:
          pattern: candidate-*
          merge-multiple: true
          path: release-assets
      - name: Verificar hashes de los bytes descargados
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 scripts/verify-release-assets.py release-assets "$RELEASE_VERSION" "$(git rev-parse HEAD)"
          (cd release-assets && sha256sum -c *.sha256)
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: 'release-assets/*'
      - name: Publicar exactamente esos adjuntos
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.tag }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          flags=(--latest)
          if [[ "$IS_PRERELEASE" == true ]]; then flags=(--prerelease --latest=false); fi
          gh release create "$RELEASE_TAG" --verify-tag "${flags[@]}" \
            --title "n_ein $RELEASE_VERSION" --notes-file "docs/releases/$RELEASE_VERSION.md" release-assets/*
  # La URL corta de Pages sirve el bootstrap ya verificado, solo tras existir su release.
  pages:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}install.sh
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: candidate-*
          merge-multiple: true
          path: release-assets
      - run: mkdir site && cp release-assets/install.sh site/install.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
