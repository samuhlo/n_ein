name: Checks locales

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Instalar Pi fijado y ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          bun install --global @earendil-works/pi-coding-agent@0.87.1
      - name: Checks sin modelos
        run: ./scripts/check.sh
