name: Checks
on:
  push:
    branches: [main, 'hotfix/**', 'feat/alpha-distribution']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: echo "value=$(cat VERSION)" >> "$GITHUB_OUTPUT"
  candidate:
    needs: version
    uses: ./.github/workflows/candidate.yml
    with:
      version: ${{ needs.version.outputs.value }}
