name: Checks locales

on:
  push:
    branches: [main, 'hotfix/**']
    tags: ['v*-preview.*']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verificar procedencia del hotfix de rama
        if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '.hotfix.')
        run: ./scripts/verify-hotfix-branch.sh "$GITHUB_REF_NAME"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Instalar Pi fijado y ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          bun install --global @earendil-works/pi-coding-agent@0.87.1
      - name: Checks sin modelos
        run: ./scripts/check.sh
      - name: Crear candidato nativo de preview
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./scripts/build-preview.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: n-ein-preview-linux-amd64-${{ github.ref_name }}
          path: |
            dist/releases/*.tar.gz
            dist/releases/*.sha256
          if-no-files-found: error
          retention-days: 14
